name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: api_pisos_direcciones
          MYSQL_USER: api_pisos_app
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3307/api_pisos_direcciones
      DB_USERNAME: api_pisos_app
      DB_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java version
        run: java --version

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mysql-client

      - name: Initialize test schema
        env:
          MYSQL_PWD: ci-test-password
        run: |
          mysql \
            --host=127.0.0.1 \
            --port=3307 \
            --user=api_pisos_app \
            api_pisos_direcciones \
            < src/main/resources/db/migration/V1_create_property_schema.sql

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify executable JAR
        shell: bash
        run: |
          shopt -s nullglob
          jars=(target/*.jar)

          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No se ha generado ningún JAR en target/."
            exit 1
          fi

          printf 'JAR generado: %s\n' "${jars[@]}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" target/*.jar \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
